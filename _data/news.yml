- date: October 23-25, 2025
  headline: "Dr. Roy and his group Presented their work in ACS Rocky Mountain Regional Meeting, Albuquerque, NM."
  description: "  Dr. Roy and one of his students (Tyler Lafferty) presented their work at this conference. The title of Dr. Roy's talk was <i>Impact of π-spacers and acceptors on the optoelectronic properties of TPA-derived donor-based dyes: First principles approach,</i> and Tyler talked on <i>Hole transport materials for enhanced perovskite solar cell efficiency using DFT and ML</i>. Welch Departmental Grant and Kilgore Faculty Research Grant support the work. Tyler is one of the Welch Departmental Fellows."
  image: "/images/newspic/rmrm_2025-1.jpg"

